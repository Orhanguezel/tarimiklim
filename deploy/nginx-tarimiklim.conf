server {
    server_name tarimiklim.com www.tarimiklim.com tarimiklim.com.tr www.tarimiklim.com.tr;
    client_max_body_size 20M;

    # Backend uploads
    location /uploads/ {
        alias /var/www/tarim-dijital-ekosistem/projects/tarimiklim/backend/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        access_log off;
    }

    # Backend API
    location /api/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Swagger
    location /documentation {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js static files: frontend first, admin fallback for admin bundle chunks.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_intercept_errors on;
        error_page 404 = @tarimiklim_admin_next_static;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /admin/_next/static/ {
        proxy_pass http://127.0.0.1:3096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location @tarimiklim_admin_next_static {
        proxy_pass http://127.0.0.1:3096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Keep mistakenly localized admin links working.
    location ~ ^/(tr|en|ar)/admin(/.*)?$ {
        return 302 /admin$2;
    }

    # Admin panel
    location /admin {
        proxy_pass http://127.0.0.1:3096;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Frontend (Next.js)
    location / {
        proxy_pass http://127.0.0.1:3088;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/tarimiklim.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tarimiklim.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    server_name tarimiklim.com www.tarimiklim.com;
    return 301 https://tarimiklim.com$request_uri;
}

# .com.tr -> tarimiklim.com redirect
server {
    listen 80;
    server_name tarimiklim.com.tr www.tarimiklim.com.tr;
    return 301 https://tarimiklim.com$request_uri;
}
